<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Boxlines</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Patrick+Hand&display=swap">
<style>
/* Layout: one full-height workspace. Slim top bar (name, tools, file actions), a bordered canvas card below it, style panel floating on its left edge. */
:root {
  --bg: #eceef2;
  --canvas: #fbfbfd;
  --dots: #c9ccd6;
  --panel: #ffffff;
  --line: #d8dbe3;
  --fg: #1b1d24;
  --muted: #646a78;
  --accent: #4b47c9;
  --accent-ink: #ffffff;
  --accent-soft: #e6e5fa;
  --danger: #c0392b;
  --elfilter: none;
  --font-ui: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --shadow: 0 1px 2px rgba(20,22,35,.08), 0 6px 18px rgba(20,22,35,.08);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101116; --canvas: #17181f; --dots: #2d2f3b; --panel: #21222b; --line: #34364a;
    --fg: #ecedf3; --muted: #9a9fb2; --accent: #9b98ff; --accent-ink: #14142e; --accent-soft: #34336a;
    --danger: #ff8b7d; --elfilter: invert(0.93) hue-rotate(180deg);
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101116; --canvas: #17181f; --dots: #2d2f3b; --panel: #21222b; --line: #34364a;
  --fg: #ecedf3; --muted: #9a9fb2; --accent: #9b98ff; --accent-ink: #14142e; --accent-soft: #34336a;
  --danger: #ff8b7d; --elfilter: invert(0.93) hue-rotate(180deg);
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px;
  overflow: hidden;
}
.app { height: 100%; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
button { font: inherit; color: inherit; }
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px; letter-spacing: -.01em; margin-right: auto; }
.brand svg { width: 22px; height: 22px; color: var(--accent); }
.group { display: flex; align-items: center; gap: 2px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 3px; box-shadow: var(--shadow); }
.ib {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-width: 34px; height: 34px; padding: 0 8px;
  background: transparent; border: 0; border-radius: 7px; cursor: pointer; color: var(--fg);
}
.ib svg { width: 18px; height: 18px; flex: none; }
.ib:hover:not(:disabled) { background: var(--accent-soft); }
.ib[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.ib:disabled { opacity: .35; cursor: default; }
.ib:focus-visible, .opt:focus-visible, .sw:focus-visible, .txt:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.ib.primary { background: var(--accent); color: var(--accent-ink); font-weight: 600; padding: 0 12px; }
.ib.primary:hover:not(:disabled) { background: var(--accent); filter: brightness(1.08); }
.ib .lbl { font-size: 13px; }
.kbd { font-size: 10px; color: var(--muted); margin-left: 1px; }
.ib[aria-pressed="true"] .kbd { color: inherit; opacity: .75; }
.stage {
  position: relative; flex: 1; min-height: 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
  background-color: var(--canvas);
  background-image: radial-gradient(circle, var(--dots) 1px, transparent 1.4px);
  background-size: 24px 24px;
}
#board { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; user-select: none; -webkit-user-select: none; }
#els { filter: var(--elfilter); }
#editor {
  position: absolute; margin: 0; padding: 0; border: 0; outline: 0; resize: none; overflow: hidden; background: transparent;
  color: var(--fg); text-align: center; line-height: 1.25; z-index: 5; caret-color: var(--accent);
}
#panel {
  position: absolute; left: 10px; top: 10px; width: 212px; max-height: calc(100% - 20px); overflow-y: auto;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 12px; z-index: 6;
  display: flex; flex-direction: column; gap: 12px;
}
#panel h2 { margin: 0 0 6px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
#panel .ctx { font-size: 12px; color: var(--muted); margin: 0; }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.sw { width: 26px; height: 26px; border-radius: 7px; border: 1px solid var(--line); padding: 0; cursor: pointer; background: var(--panel); position: relative; overflow: hidden; }
.sw i { position: absolute; inset: 0; display: block; filter: var(--elfilter); }
.sw.none i { background: linear-gradient(135deg, transparent 46%, #d33 46%, #d33 54%, transparent 54%); filter: none; }
.sw[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: 1px; }
input[type="color"].pick { width: 26px; height: 26px; padding: 0; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); cursor: pointer; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; width: 100%; }
.opt { flex: 1; height: 30px; border: 0; background: transparent; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 500; }
.opt + .opt { border-left: 1px solid var(--line); }
.opt:hover { background: var(--accent-soft); }
.opt[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.opt svg { width: 22px; height: 14px; }
.acts2 { display: flex; gap: 6px; }
.acts2 .txt { flex: 1; height: 32px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); border-radius: 8px; background: transparent; cursor: pointer; font-size: 12.5px; font-weight: 500; }
.acts2 .txt svg { width: 15px; height: 15px; }
.acts2 .txt:hover:not(:disabled) { background: var(--accent-soft); }
.acts2 .txt.del { color: var(--danger); }
.acts2 .txt:disabled { opacity: .4; cursor: default; }
.zoom { position: absolute; left: 10px; bottom: 10px; display: flex; z-index: 6; }
.zoom .ib { height: 32px; min-width: 32px; }
.zoom .pct { min-width: 54px; font-variant-numeric: tabular-nums; font-size: 12.5px; }
#hint { position: absolute; right: 12px; bottom: 12px; max-width: min(340px, calc(100% - 24px)); font-size: 12.5px; color: var(--muted); text-align: right; line-height: 1.4; pointer-events: none; z-index: 4; }
#toast {
  position: absolute; left: 50%; bottom: 54px; transform: translateX(-50%); background: var(--fg); color: var(--bg); border-radius: 9px;
  padding: 8px 12px; font-size: 13px; display: flex; gap: 12px; align-items: center; z-index: 9; box-shadow: var(--shadow); max-width: calc(100% - 24px);
}
#toast button { background: none; border: 0; color: inherit; font-weight: 700; text-decoration: underline; cursor: pointer; padding: 0; }
.sheet { position: absolute; inset: 0; z-index: 20; background: rgba(10,12,20,.45); display: flex; align-items: center; justify-content: center; padding: 16px; }
.sheet .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 16px; width: min(560px, 100%); display: flex; flex-direction: column; gap: 10px; }
.sheet h3 { margin: 0; font-size: 16px; }
.sheet p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.45; }
.sheet textarea { width: 100%; height: 180px; resize: vertical; font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; background: var(--canvas); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
.sheet .btns { display: flex; justify-content: flex-end; gap: 8px; }
.sheet .btns button { height: 34px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line); background: transparent; cursor: pointer; font-weight: 500; }
.sheet .btns .go { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 600; }
#panelToggle { display: none; position: absolute; left: 10px; top: 10px; z-index: 7; }
@media (max-width: 720px) {
  .brand span { display: none; }
  .kbd { display: none; }
  .ib .lbl { display: none; }
  .ib.primary .lbl { display: inline; }
  #panelToggle { display: inline-flex; }
  #panel { left: 10px; right: 10px; top: auto; bottom: 52px; width: auto; max-height: 46%; display: none; }
  #panel.open { display: flex; }
  #panelToggle { top: auto; bottom: 10px; left: auto; right: 10px; }
  .zoom { bottom: 10px; }
  #hint { display: none; }
  #toast { bottom: 100px; }
}
@media (prefers-reduced-motion: no-preference) { .ib, .opt { transition: background-color .12s; } }
</style>

</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="3.5" width="8" height="6" rx="1.5"/><rect x="13.5" y="14.5" width="8" height="6" rx="1.5"/><path d="M10.5 6.5h3a3 3 0 0 1 3 3v5"/></svg>
      <span>Boxlines</span>
    </div>
    <div class="group" role="toolbar" aria-label="Tools" id="tools"></div>
    <div class="group" role="toolbar" aria-label="History">
      <button class="ib" id="undo" title="Undo (Ctrl+Z)" aria-label="Undo"></button>
      <button class="ib" id="redo" title="Redo (Ctrl+Shift+Z)" aria-label="Redo"></button>
    </div>
    <div class="group" role="toolbar" aria-label="File">
      <button class="ib" id="new" title="Clear the canvas" aria-label="New canvas"></button>
      <button class="ib" id="open" title="Open a saved file" aria-label="Open file"></button>
      <button class="ib primary" id="save" title="Save to a file (Ctrl+S)"><span id="saveIcon"></span><span class="lbl">Save</span></button>
    </div>
  </header>
  <main class="stage" id="stage">
    <svg id="board" aria-label="Drawing canvas">
      <g id="world"><g id="els"></g><g id="over"></g></g>
    </svg>
    <textarea id="editor" hidden aria-label="Box text" spellcheck="false"></textarea>
    <button class="ib group" id="panelToggle" aria-label="Style options"><span id="panelIcon"></span><span class="lbl">Style</span></button>
    <aside id="panel" aria-label="Style"></aside>
    <div class="zoom group">
      <button class="ib" id="zout" aria-label="Zoom out"></button>
      <button class="ib pct" id="zreset" title="Fit diagram to screen">100%</button>
      <button class="ib" id="zin" aria-label="Zoom in"></button>
    </div>
    <div id="hint"></div>
    <div id="toast" hidden></div>
  </main>
</div>
<input type="file" id="file" accept=".json,application/json" hidden>

<script src="https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.js"></script>
